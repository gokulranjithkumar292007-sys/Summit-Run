 g.visible=m||!(inv>0&&Math.floor(t*20)%2);

  d.L[0].rotation.x=Math.sin(q)*1.1;d.L[1].rotation.x=Math.sin(q+.7)*1.1;d.L[2].rotation.x=Math.sin(q+Math.PI)*1.1;d.L[3].rotation.x=Math.sin(q+Math.PI+.7)*1.1;
  d.body.rotation.x=Math.sin(q)*.1;d.tail.rotation.z=Math.sin(q*.5)*.5;k.rotation.z=Math.sin(q*.5)*.06});
 const sk=shake>0?shake*.5:0,fv=62+Math.min(14,(speed-75)/135*14);if(Math.abs(cam.fov-fv)>.05){cam.fov=fv;cam.updateProjectionMatrix()}
